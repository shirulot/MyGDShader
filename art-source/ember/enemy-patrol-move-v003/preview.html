<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>巡逻兵移动 v003 · 固定部件审阅</title>
<style>body{background:#16232b;color:#dae1dc;font:16px system-ui;margin:28px}h1{font-size:25px}p{max-width:1000px;color:#b3c1c0;line-height:1.7}button{background:#31434b;border:1px solid #63757c;border-radius:6px;color:white;padding:10px;margin:3px;cursor:pointer}.row{display:flex;gap:32px;flex-wrap:wrap}canvas{image-rendering:pixelated;background:#23363e;border:1px solid #58676b}.panel{min-width:280px}.status{color:#edcb87}img{image-rendering:pixelated;max-width:100%}.label{font-weight:bold}</style>
<h1>巡逻兵移动 v003 · 固定部件小样</h1><p class="status">v003 候选 · 等待 TA 审核。八帧已采用实体二值 Alpha；造型、步态与原生轮廓仍待美术验收。</p>
<p>同一套头胸、枪、夹爪和腿部纹理驱动八相位。左/右均指角色自身；绿色点为支撑足、橙点为摆动足，青点为该足的地面投影，白十字为固定 root。标记是已登记关节，不是自动 bbox 对齐。</p>
<div><button id="toggle">暂停</button><button id="prev">前一帧</button><button id="next">后一帧</button><button id="restart">重播</button><button id="zoom">切到 1×</button><button id="marks">显示支撑标记</button><button id="bg">切换底色</button></div>
<p id="state"></p><div class="row"><div class="panel"><p class="label">8 FPS 正常播放</p><canvas id="normal" width="64" height="80"></canvas></div><div class="panel"><p class="label">1 FPS 慢速</p><canvas id="slow" width="64" height="80"></canvas></div></div>
<p>固定区域全帧 4× 联系图（每格使用同一裁切区域，仅用于观察细节）：</p><img src="qa/move_detail_4x.png" alt="八帧固定区域联系图">
<script>
const atlas=new Image();atlas.src='output/move_down_v003.png';const canvases=['normal','slow'].map(id=>document.getElementById(id));let poses=[],paused=false,manual=0,epoch=performance.now(),zoom=4,marks=false,bg=0;
fetch('output/catalog_v003.json').then(r=>r.json()).then(d=>poses=d.poses);
const el=id=>document.getElementById(id), backgrounds=['#23363e','#ffffff','#000000'];
function size(){canvases.forEach(c=>{c.style.width=64*zoom+'px';c.style.height=80*zoom+'px';});}size();
function draw(canvas,index){const c=canvas.getContext('2d');c.imageSmoothingEnabled=false;c.fillStyle=backgrounds[bg];c.fillRect(0,0,64,80);if(atlas.complete&&atlas.naturalWidth)c.drawImage(atlas,index*128+32,36,64,80,0,0,64,80);if(marks&&poses[index]){c.fillStyle='#fff';c.fillRect(30,68,5,1);c.fillRect(32,66,1,5);Object.values(poses[index].legs).forEach(p=>{c.fillStyle='#4de5e5';c.fillRect(p.projected_ground_px[0]-33,p.projected_ground_px[1]-36,3,1);c.fillStyle=p.support?'#7cff6b':'#ff9851';c.fillRect(p.sole_marker_px[0]-33,p.sole_marker_px[1]-37,3,3);});}}
function tick(t){let elapsed=(t-epoch)/1000;const a=paused?manual:Math.floor(elapsed*8)%8,b=paused?manual:Math.floor(elapsed)%8;draw(canvases[0],a);draw(canvases[1],b);el('state').textContent=(paused?'已暂停':'播放中')+' · 正常 f0'+a+' · 慢速 f0'+b+' · '+zoom+'× · '+(poses[a]?.phase||'加载中');requestAnimationFrame(tick);}requestAnimationFrame(tick);
el('toggle').onclick=()=>{if(!paused)manual=Math.floor((performance.now()-epoch)/125)%8;else epoch=performance.now()-manual*125;paused=!paused;el('toggle').textContent=paused?'继续':'暂停';};
function step(n){if(!paused)manual=Math.floor((performance.now()-epoch)/125)%8;paused=true;manual=(manual+n+8)%8;el('toggle').textContent='继续';}el('prev').onclick=()=>step(-1);el('next').onclick=()=>step(1);el('restart').onclick=()=>{epoch=performance.now();manual=0;};el('zoom').onclick=()=>{zoom=zoom===4?1:4;size();el('zoom').textContent=zoom===4?'切到 1×':'切到 4×';};el('marks').onclick=()=>{marks=!marks;el('marks').textContent=marks?'隐藏支撑标记':'显示支撑标记';};el('bg').onclick=()=>bg=(bg+1)%3;
</script></html>
