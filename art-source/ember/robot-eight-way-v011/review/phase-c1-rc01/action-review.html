<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>机器人 · 待机与采集小样</title>
<style>body{margin:0;background:#19252d;color:#eae8d9;font:15px system-ui,sans-serif}main{max-width:1050px;margin:32px auto;padding:0 24px}h1{font-size:26px;margin-bottom:8px}p{color:#b6c3c7;line-height:1.7}label{display:inline-flex;align-items:center;gap:8px;margin:0 16px 12px 0}button,select{border:1px solid #465965;background:#293e4b;color:#eae8d9;border-radius:5px;padding:9px 13px;margin:0 6px 12px 0;font:inherit}button{cursor:pointer}.views{display:grid;grid-template-columns:2fr 1fr;gap:16px}.box{border:1px solid #3c505c;border-radius:6px;overflow:hidden}.caption{padding:12px;color:#bac8cd}.stage{height:430px;display:flex;align-items:center;justify-content:center;background:#ece9d8}.stage.dark{background:#182631}.stage.checker{background-color:#86949b;background-image:conic-gradient(#647780 25%,transparent 0 50%,#647780 0 75%,transparent 0);background-size:32px 32px}canvas,img{image-rendering:pixelated}input[type=range]{width:70%;vertical-align:middle}.status{color:#e2b77a}details{margin-top:18px}details img{max-width:100%;display:block;margin-top:12px}a{color:#c8dfe9}@media(max-width:650px){.views{grid-template-columns:1fr}}</style>
<main><h1>机器人 · 南西待机与采集</h1><p>沿用已经通过的机器人。待机上身微动，采集保持双脚支撑；新动作小样待审。</p>
<label>动作<select id="action"><option value="idle">待机 · 2帧</option><option value="collect">采集 · 4帧</option><option value="walk">行走 · 已通过</option><option value="pose">固定造型参考</option></select></label>
<label>速度<select id="speed"><option value="1">正常速度</option><option value="0.25">四分之一速度</option></select></label>
<label>背景<select id="background"><option value="light">浅底</option><option value="dark">深底</option><option value="checker">棋盘格</option></select></label>
<div><button id="play">暂停</button><button id="replay">重播动作</button><button id="previous">上一帧</button><button id="next">下一帧</button><label><input id="return-idle" type="checkbox" checked>采集结束回待机</label></div>
<p class="status" id="status">载入小样…</p><div class="views"><div class="box"><div class="caption">4× 最近邻</div><div class="stage" id="large-stage"><canvas id="large" width="256" height="384" role="img" aria-label="4倍动作预览"></canvas></div><div class="caption"><span id="frame-text"></span> <input id="frame" type="range" min="0" max="1" value="0" aria-label="帧索引"></div></div><div class="box"><div class="caption">1× 原生 · 64 × 96</div><div class="stage" id="native-stage"><canvas id="native" width="64" height="96" role="img" aria-label="原生动作预览"></canvas></div><div class="caption">固定 root (32, 80)</div></div></div>
<details><summary>待机两帧对照</summary><img src="previews/idle_down_left_light_4x_v011.png" alt="南西待机两帧"></details><details><summary>采集四帧对照</summary><img src="previews/collect_down_left_light_4x_v011.png" alt="南西采集四帧"></details>
<p>采集：准备 → 下探 → 保持 → 回位，6 FPS、非循环。回位与待机首帧相同。当前仅审这一方向的新动作，单张造型参考不计为待机。</p><p><a href="action-pilot-metadata.json">素材清单</a> · <a href="godot-action-review/project.godot">独立 Godot 工程</a> · <a href="walk-review.html">八向行走</a></p></main>
<script>
// 预览只消费最终PNG和动作约定，不绘制或修饰角色内容。
const $=s=>document.querySelector(s);let meta,clip,frame=0,playing=true,last=0;const images=new Map();
function draw(){if(!clip)return;const source=images.get(clip.frames[frame].file);for(const[id,scale]of[['large',4],['native',1]]){const c=$('#'+id),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,c.width,c.height);if(source)ctx.drawImage(source,0,0,64*scale,96*scale);}$('#frame').value=frame;$('#frame-text').textContent=`F${String(frame).padStart(2,'0')} / ${clip.frames.length}帧`;$('#play').textContent=playing?'暂停':'播放';}
function select(){clip=meta.clips.find(c=>c.action===$('#action').value);frame=0;$('#frame').max=clip.frames.length-1;$('#status').textContent=clip.action==='walk'?'已通过的南西行走原帧。':clip.action==='pose'?'身份参考；不计为最终待机。':`${clip.fps} FPS · ${clip.loop?'循环':'非循环'} · 新动作待独立审查`;last=performance.now();draw();}
$('#action').onchange=()=>{playing=true;select()};$('#speed').onchange=()=>{last=performance.now()};$('#background').onchange=()=>{for(const id of['large-stage','native-stage'])$('#'+id).className='stage '+($('#background').value==='light'?'':$('#background').value)};
$('#play').onclick=()=>{playing=!playing;last=performance.now();draw()};$('#replay').onclick=()=>{frame=0;playing=true;last=performance.now();draw()};$('#previous').onclick=()=>{playing=false;frame=(frame+clip.frames.length-1)%clip.frames.length;draw()};$('#next').onclick=()=>{playing=false;frame=(frame+1)%clip.frames.length;draw()};$('#frame').oninput=()=>{playing=false;frame=Number($('#frame').value);draw()};
function tick(now){if(clip&&playing&&now-last>=1000/(clip.fps*Number($('#speed').value))){last=now;if(frame+1<clip.frames.length)frame++;else if(clip.loop)frame=0;else if(clip.action==='collect'&&$('#return-idle').checked){$('#action').value='idle';select()}else playing=false;draw()}requestAnimationFrame(tick)}
(async()=>{meta=await(await fetch('action-pilot-metadata.json')).json();await Promise.all(meta.source_files.map(async f=>{const img=new Image();img.src=f.file;await img.decode();images.set(f.file,img)}));select();requestAnimationFrame(tick)})();
</script></html>
