<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>机器人动作试样 V015 · 五组新增动作</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101820;color:#ece9d8;font:15px/1.6 system-ui}main{max-width:1080px;margin:auto;padding:24px}h1{font-size:25px;margin:0}p{color:#becbc4}.tag{color:#e2b77a;letter-spacing:2px;font-size:12px}.controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:18px 0}button,select{font:inherit;color:#ece9d8;background:#2b3e4b;border:1px solid #566b78;border-radius:6px;padding:7px 12px}input{width:190px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{display:flex;flex-direction:column;align-items:center;padding:12px;background:#182631;border:1px solid #2b3e4b;border-radius:10px;cursor:pointer}.card.active{border-color:#e2b77a}.card strong{align-self:flex-start}.card span{font-size:12px;color:#829ba3}.card canvas{width:128px;height:192px;image-rendering:pixelated}section{margin-top:24px;padding:18px;background:#182631;border-radius:10px}h2{font-size:18px;margin:0}.detail{display:flex;gap:24px;align-items:center}.detail img{image-rendering:pixelated}.ref{width:192px;transform:scaleX(-1)}.strip{width:100%;image-rendering:pixelated}a{color:#e2b77a}.note{font-size:13px;color:#829ba3}output{min-width:32px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.detail{display:block}}
</style><main><span class="tag">V015 · LEFT SIDE ACTION STUDIES</span><h1>五组新动作，连同采集一起看</h1><p>待机、行走、小跑、推物、拉动。点击动作卡片，可对照作者的参考动图和六帧展开图。</p>
<div class="controls"><button id="play">暂停</button><label for="speed">速度</label><select id="speed"><option value="1">正常</option><option value="0.35">慢放</option></select><label for="frame">逐帧</label><input id="frame" type="range" min="0" max="5" value="0"><output id="frameLabel">自动</output><span id="state" class="note">加载中</span></div><div class="grid" id="grid"></div>
<section><h2 id="title">行走 · 动作参考</h2><div class="detail"><img id="ref" class="ref" alt="作者公开动作参考"><div><p id="description"></p><p id="limitation" class="note"></p></div></div><img id="strip" class="strip" alt="六帧动作展开图"></section>
<p class="note">当前均为左向试样：64×96 透明帧，每组 6 帧。已做统一尺度、落地点整理和透明检查；步态节奏、装甲细节与动作衔接仍待视觉验收。旧资源未替换。</p><p><a href="robot-actions-v015-pilot.zip">下载五组 PNG / GIF / WebP</a> · <a href="https://deadrevolver.itch.io/pixel-prototype-player-sprites" target="_blank" rel="noreferrer">参考：Dead Revolver 原作页面</a></p></main>
<script>
const actions=[['idle','待机',4,'idle','微幅肩胸起伏，脚掌保持支撑。','关注头盔和脚靴细节是否闪动。'],['walk','行走',7,'walk','参考交替承重和摆腿过身，后半周期单独修订了近远腿。','手臂摆幅偏小，近远腿在接近重叠时仍需检查。'],['run','小跑',9,'run','增加屈肘、后腿回收和短暂离地，区别于行走。','后半周期的腿部交替仍不够清楚；目前保留为待修步态试样。'],['push','推物',5,'interact_b','身体前倾，双臂前撑，后腿提供支撑。','当前是原地发力试样，没有加入箱体和位移。'],['pull','拉动',5,'interact_c','髋部后坐，手肘收回，前后脚分担重量。','需结合实际交互物的位置校准手部接触点。'],['collect','采集 · V014',5,'collect','保留上一版的屈膝采集，方便比较同一角色的动作。','这是上一版试样，未在此次重生成。']];
const grid=document.querySelector('#grid');let selected='walk',frames={},contexts={},playing=true,elapsed=0,last=0,manual=0;
function paths(a){return Array.from({length:6},(_,i)=>a==='collect'?`../collect-knee-v014-pilot/frames/left_collect_f0${i}.png`:`frames/${a}/f0${i}.png`)}
function select(a){selected=a;const c=actions.find(x=>x[0]===a);document.querySelector('#title').textContent=c[1]+' · 动作参考';document.querySelector('#description').textContent=c[4];document.querySelector('#limitation').textContent=c[5];document.querySelector('#ref').src=a==='collect'?'../collect-knee-v014-pilot/references/deadrevolver-crouch.gif':`references/${c[3]}.gif`;document.querySelector('#strip').src=a==='collect'?'../collect-knee-v014-pilot/previews/left_collect_strip.png':`previews/${a}-strip.png`;document.querySelectorAll('.card').forEach(e=>e.classList.toggle('active',e.dataset.action===a))}
for(const[a,name]of actions){const b=document.createElement('button');b.className='card';b.dataset.action=a;b.innerHTML=`<strong>${name}</strong><canvas width="64" height="96" aria-label="${name}动画"></canvas><span>左向 · 六帧${a==='collect'?' · 已有':''}</span>`;b.onclick=()=>select(a);grid.append(b);contexts[a]=b.querySelector('canvas').getContext('2d')}
const load=src=>new Promise((resolve,reject)=>{const im=new Image;im.onload=()=>resolve(im);im.onerror=()=>reject(new Error(src));im.src=src});
function render(){for(const[a,,fps]of actions){if(!frames[a])continue;const i=playing?Math.floor(elapsed/1000*fps)%6:manual,c=contexts[a];c.clearRect(0,0,64,96);c.fillStyle='#2b3e4b';c.fillRect(8,80,48,1);c.imageSmoothingEnabled=false;c.drawImage(frames[a][i],0,0)}}
function tick(t){if(last&&playing)elapsed+=(t-last)*Number(document.querySelector('#speed').value);last=t;render();requestAnimationFrame(tick)}
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'暂停':'播放';document.querySelector('#frameLabel').textContent=playing?'自动':`F${manual}`};
document.querySelector('#frame').oninput=e=>{manual=Number(e.target.value);playing=false;document.querySelector('#play').textContent='播放';document.querySelector('#frameLabel').textContent=`F${manual}`;render()};
Promise.all(actions.map(async([a])=>{frames[a]=await Promise.all(paths(a).map(load))})).then(()=>{document.querySelector('#state').textContent='36 张帧已加载';select('walk');requestAnimationFrame(tick)}).catch(e=>document.querySelector('#state').textContent='加载失败 '+e.message);
</script></html>
