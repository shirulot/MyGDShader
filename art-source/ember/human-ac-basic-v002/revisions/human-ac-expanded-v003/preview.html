<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A / C · 方向与动作扩展</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101820;color:#ece9d8;font:16px system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:24px}h1{font-size:25px;margin:0 0 10px}p{color:#aab7b1;line-height:1.6}nav{display:flex;flex-wrap:wrap;gap:12px;background:#20313d;padding:14px;border-radius:8px;margin:14px 0}label{display:flex;align-items:center;gap:6px}button,select{font:inherit;padding:8px;color:#ece9d8;background:#304653;border:1px solid #5e7883;border-radius:5px;cursor:pointer}button[aria-pressed=true]{border-color:#e2b77a;background:#5a4935}#directions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:390px}section{display:grid;grid-template-columns:1fr 1fr;gap:16px}article{border:1px solid #304653;border-radius:8px;background:#182631;padding:12px;text-align:center}h2{font-size:19px;text-align:left;margin:0}canvas{width:256px;height:384px;image-rendering:pixelated;max-width:100%}.seam{width:100%;image-rendering:pixelated}small{display:block;text-align:left;color:#aab7b1;margin:8px 0}#status{color:#e2b77a}a{color:#e2b77a}footer{font-size:14px;line-height:1.7;margin-top:18px}@media(max-width:650px){main{padding:12px}section{gap:8px}article{padding:8px}canvas{width:100%;height:auto}}</style>
<main><h1>A / C · 方向与动作扩展 v003</h1><p id="summary">载入动作目录…</p><p>新增方向为动作试样：斜向走跑仍有体态与定位漂移，首尾衔接尚未通过视觉验收。可切换慢放和尾首帧条检查。</p>
<nav><label>动作<select id="action"><option value="idle">待机</option><option value="walk" selected>行走</option><option value="run">跑动</option><option value="crouch">下蹲起身</option><option value="jump">原地跳跃</option><option value="collect">采集</option><option value="push">原地推力</option><option value="pull">原地拉力</option></select></label><label>速度<select id="speed"><option value="1">正常</option><option value="0.333">慢放 ×⅓</option><option value="0.1">逐步观察 ×0.1</option></select></label><label>背景<select id="background"><option value="#182631">深色</option><option value="#ece9d8">浅色</option></select></label><label>倍率<select id="scale"><option value="4">4×</option><option value="1">1× 原生</option></select></label><button id="play">暂停</button><button id="step">下一帧</button><button id="seam">尾→首</button><label>帧<input id="frame" type="range" min="0" max="7" value="0"></label><span id="status"></span></nav>
<nav><div id="directions"><button data-dir="up_left">↖ 左后</button><button data-dir="up">↑ 背面</button><button data-dir="up_right">↗ 右后</button><button data-dir="left" aria-pressed="true">← 左</button><span></span><button data-dir="right">右 →</button><button data-dir="down_left">↙ 左前</button><button data-dir="down">↓ 正面</button><button data-dir="down_right">↘ 右前</button></div><p id="availability"></p></nav>
<section><article><h2>A · 勘探员</h2><canvas id="A" width="256" height="384"></canvas><small id="infoA"></small><img id="seamA" class="seam" alt="A 尾首邻域"></article><article><h2>C · 信号员</h2><canvas id="C" width="256" height="384"></canvas><small id="infoC"></small><img id="seamC" class="seam" alt="C 尾首邻域"></article></section>
<footer>下方帧条：倒数第二帧 → 尾帧 → 首帧 → 第二帧。切换同一动作的方向保留播放相位。<br>左向基础动作沿用 v002；新增部分为待审动作试样。<a href="catalog.json">动作目录</a> · <a href="qa/review.json">检查记录</a></footer></main>
<script>
// 共用周期时钟；方向切换保留相位，动作切换回首帧，禁止倒放走跑来补缺帧。
const ui=Object.fromEntries(['action','speed','background','scale','play','step','seam','frame','status','summary','availability'].map(k=>[k,document.getElementById(k)]));
let catalog=[],images={},direction='down',playing=true,elapsed=0,last=0,phase=0,cycles=0;
function clip(ch){return catalog.find(c=>c.character===ch&&c.action===ui.action.value&&c.direction===direction);}
function period(){const c=clip('A')||clip('C');return c?c.duration_ms*c.frame_count:1000;}
function refresh(){for(const ch of ['A','C']){const c=clip(ch),seam=document.getElementById('seam'+ch);seam.hidden=!c;if(c)seam.src=`qa/${c.key}-seam.png`;document.getElementById('info'+ch).textContent=c?`${c.frame_count} 帧 · ${c.duration_ms}ms/帧${c.source_version?' · 沿用 v002':' · 新增试样'}`:'该方向动作尚未制作';}const c=clip('A')||clip('C');ui.frame.max=(c?.frame_count||8)-1;ui.availability.textContent=['crouch','jump','collect','push','pull'].includes(ui.action.value)?'扩展动作先看左向的完整动作过程。':'选择方向，对比同一动作的朝向。';for(const b of document.querySelectorAll('[data-dir]')){b.setAttribute('aria-pressed',String(b.dataset.dir===direction));b.disabled=['crouch','jump','collect','push','pull'].includes(ui.action.value)&&b.dataset.dir!=='left';}}
function draw(){for(const ch of ['A','C']){const c=clip(ch),canvas=document.getElementById(ch),g=canvas.getContext('2d'),scale=Number(ui.scale.value);g.imageSmoothingEnabled=false;g.fillStyle=ui.background.value;g.fillRect(0,0,256,384);const x=(256-64*scale)/2,y=(384-96*scale)/2;g.strokeStyle='#829ba3';g.beginPath();g.moveTo(x+4,y+80*scale+.5);g.lineTo(x+60*scale,y+80*scale+.5);g.stroke();if(c&&images[c.key]){const f=Math.min(c.frame_count-1,Math.floor(phase*c.frame_count));g.drawImage(images[c.key],f*64,0,64,96,x,y,64*scale,96*scale);}}const c=clip('A')||clip('C'),f=Math.floor(phase*(c?.frame_count||8));ui.frame.value=f;ui.status.textContent=`F${String(f).padStart(2,'0')} · 已跨尾首 ${cycles} 次`;}
function tick(t){if(playing){elapsed+=Math.min(t-last,100)*Number(ui.speed.value);phase=(elapsed%period())/period();cycles=Math.floor(elapsed/period());}last=t;draw();requestAnimationFrame(tick);}
function pauseAt(frame){const n=(clip('A')||clip('C'))?.frame_count||8;playing=false;ui.play.textContent='播放';phase=frame/n;elapsed=(cycles+phase)*period();draw();}
ui.action.onchange=()=>{elapsed=0;phase=0;cycles=0;if(['crouch','jump','collect','push','pull'].includes(ui.action.value))direction='left';refresh();};
for(const b of document.querySelectorAll('[data-dir]'))b.onclick=()=>{direction=b.dataset.dir;elapsed=(cycles+phase)*period();refresh();};
ui.play.onclick=()=>{playing=!playing;ui.play.textContent=playing?'暂停':'播放';};ui.frame.oninput=()=>pauseAt(Number(ui.frame.value));
ui.step.onclick=()=>{const n=(clip('A')||clip('C'))?.frame_count||8;const f=Math.floor(phase*n);if(f===n-1)cycles++;pauseAt((f+1)%n);};ui.seam.onclick=()=>pauseAt(((clip('A')||clip('C'))?.frame_count||8)-1);
async function load(){const data=await(await fetch('catalog.json',{cache:'no-store'})).json();catalog=data.clips;await Promise.all(catalog.map(async c=>{const im=new Image();im.src=c.atlas;await im.decode();images[c.key]=im;}));ui.summary.textContent=`${catalog.length} 段动作 · ${data.total_frames} 帧。可正常循环、慢放、逐帧检查。`;refresh();requestAnimationFrame(tick);}
load().catch(e=>ui.summary.textContent='载入失败：'+e.message);
</script></html>
