<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>巡逻兵腿部校准 C002 · 待审</title>
<style>body{margin:24px;background:#151b22;color:#dbe2e7;font:16px system-ui}h1{font-size:24px}p{line-height:1.6;color:#afbbc4}.controls{display:flex;gap:12px;margin:20px 0}button,select{font:inherit;background:#253340;color:inherit;padding:8px 12px;border:1px solid #506271;border-radius:5px}.pair,.parts{display:grid;gap:20px;grid-template-columns:repeat(2,1fr)}.parts{grid-template-columns:repeat(3,1fr);margin-top:24px}section{background:#202932;padding:14px;border:1px solid #3b4855;border-radius:8px}h2{font-size:16px}.stage{background:#d2d6dc;height:514px;display:flex;align-items:center;justify-content:center;overflow:auto}img{image-rendering:pixelated;width:512px;height:512px;flex-shrink:0}.parts .stage{height:258px}.parts img{width:256px;height:256px}.dark .stage{background:#080b10}.one .pair img{width:128px;height:128px}@media(max-width:900px){.pair,.parts{grid-template-columns:1fr}}</style>
<h1>巡逻兵 W/E 腿部校准 C002</h1><p>中性造型与拆件待审。保留原近腿可见甲片、蓝灰颜色和靴底；远腿按同方向原零件补成独立实例。此页不计为动作通过。</p>
<div class="controls"><label>方向 <select aria-label="方向" id="dir"><option value="left">← 正左</option><option value="right">→ 正右</option></select></label><button id="zoom">切到 1×</button><button id="bg">切到深底</button></div>
<div class="pair"><section><h2>原设定 · S002</h2><div class="stage"><img id="original" alt="原通过中性图"></div></section><section><h2>新绑定 · C002 候选</h2><div class="stage"><img id="candidate" alt="新候选中性图"></div></section></div>
<p>共同128×128画布，root(64,104)。左向49、右向50个像素变化；底行y103保留原样。下方拆件统一2×。</p>
<div class="parts"><section><h2>身体与双臂工具</h2><div class="stage"><img id="body" alt="固定身体"></div></section><section><h2>原近腿可见设计与闭合连接</h2><div class="stage"><img id="near" alt="近腿实例"></div></section><section><h2>同设计远腿实例</h2><div class="stage"><img id="far" alt="远腿实例"></div></section></div>
<script>const el=id=>document.getElementById(id);function draw(){let d=el('dir').value;el('original').src=`source/${d}.png`;el('candidate').src=`output/neutral_${d}.png`;for(let key of ['body','near','far'])el(key).src=`output/${d}_${key}.png`}el('dir').onchange=draw;el('zoom').onclick=()=>{document.body.classList.toggle('one');el('zoom').textContent=document.body.classList.contains('one')?'切到 4×':'切到 1×'};el('bg').onclick=()=>{document.body.classList.toggle('dark');el('bg').textContent=document.body.classList.contains('dark')?'切到浅底':'切到深底'};draw();</script></html>
