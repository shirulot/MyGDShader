<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A/C v005 · 骨架参考修订小样</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#becbc4;font:15px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:30px}h1{font-size:27px;color:#ece9d8;margin:0 0 12px}.sub{line-height:1.8;color:#9dafb5}.notice{padding:12px 16px;border-left:3px solid #b77c4b;background:#182631;margin:18px 0}nav{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}button,select{background:#263c48;color:#ece9d8;border:1px solid #4d6470;padding:9px 13px;border-radius:5px;cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #51c5c2}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{border:1px solid #344c57;border-radius:8px;padding:16px}.card h2{font-size:17px;margin:0 0 12px}.stage{display:flex;justify-content:center;overflow:auto}canvas{width:384px;height:384px;max-width:100%;image-rendering:pixelated;background:#182631}.readout{font-variant-numeric:tabular-nums;margin-top:8px}.links{display:flex;gap:20px;margin:20px 0}a{color:#72ceca}.strip{width:100%;image-rendering:pixelated;background:#182631}summary{cursor:pointer;margin:18px 0}#details{line-height:1.8}@media(max-width:750px){.pair{grid-template-columns:1fr}}
</style>
<main><h1>A/C · v005 动作修订小样</h1>
<div class="sub">固定方向母版＋关节轨迹参考。仅三组小样；保留旧左向素材。诊断导出64×96，画面以4×最近邻显示。</div>
<div class="notice">候选，尚未通过完整视觉和Godot验收。下方并列使用相同动作相位；v004含旧注册偏移，v005不使用逐帧补偿。源图仍须逐项检查。</div>
<nav><select id="clip" aria-label="动作"></select><button id="pause">暂停</button><button id="step">下一帧</button><button id="seam">尾首接缝</button><select id="speed" aria-label="播放速度"><option value="1">正常速度</option><option value="0.25">四分之一速度</option></select><button id="bg">切换深浅底</button><button id="guides">辅助线：开</button></nav>
<div class="pair"><section class="card"><h2>v004 · 修订前</h2><div class="stage"><canvas id="old" width="384" height="384"></canvas></div><div class="readout" id="oldstate"></div></section><section class="card"><h2>v005 · 当前候选</h2><div class="stage"><canvas id="next" width="384" height="384"></canvas></div><div class="readout" id="newstate"></div></section></div>
<div class="links"><a id="source" target="_blank">生成原稿</a><a id="pose" target="_blank">输入关节轨迹图</a><a href="qa/C-existing-direction-masters.png" target="_blank">C原有八向身份对照</a></div>
<div id="details"></div>
<details open><summary>尾部两帧 → 首部两帧</summary><img id="seamimg" class="strip"></details>
<details><summary>完整序列</summary><img id="contact" class="strip"></details>
<p class="sub">轨迹图是人工草案，内置生图接受的是图像参考，不能等同于逐关节强制约束。固定格导出只作诊断，未标记原生像素生产完成。</p></main>
<script>
// 对比采用归一化动作相位，避免4帧和8帧待机因下标不同而错位。
const $=id=>document.getElementById(id);let clips=[],current,images={},elapsed=0,last=0,playing=true,light=false,lines=true,seamIndex=0;
const labels={'A-idle-down_right':'A · 右下待机','A-walk-down_right':'A · 右下行走','C-run-down_left':'C · 左下跑动'};
function loadImage(path){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error(path));img.src=path;});}
async function choose(){current=clips.find(c=>c.key===$('clip').value);playing=false;elapsed=0;images={};images.old=await loadImage('before/'+current.key+'.png');images.next=await loadImage(current.atlas);$('source').href=current.source;$('pose').href='poses/'+current.key+'.png';$('seamimg').src='qa/'+current.key+'-seam.png';$('contact').src='qa/'+current.key+'-contact.png';$('details').textContent=`${current.frame_count}帧 × ${current.duration_ms}ms。固定root (32,80)。本段状态：${current.visual_status}；${(current.issues||[]).join(" ")}`;playing=true;$('pause').textContent='暂停';draw();}
function drawOne(id,img,frame,offset=[0,0]){const ctx=$(id).getContext('2d');ctx.imageSmoothingEnabled=false;ctx.fillStyle=light?'#d4d9d4':'#182631';ctx.fillRect(0,0,384,384);ctx.drawImage(img,frame*64,0,64,96,(16+offset[0])*4,offset[1]*4,256,384);if(lines){ctx.strokeStyle=light?'#647b83':'#4d6470';ctx.beginPath();ctx.moveTo(192,0);ctx.lineTo(192,384);ctx.moveTo(0,320);ctx.lineTo(384,320);ctx.stroke();}}
function draw(){if(!current||!images.old||!images.next)return;const total=current.frame_count*current.duration_ms;const phase=(elapsed%total)/total;const n=Math.min(current.frame_count-1,Math.floor(phase*current.frame_count));const o=Math.min(current.old.frame_count-1,Math.floor(phase*current.old.frame_count));drawOne('old',images.old,o,current.old.draw_offsets?.[o]||[0,0]);drawOne('next',images.next,n);$('oldstate').textContent=`F${String(o).padStart(2,'0')} / ${current.old.frame_count}`;$('newstate').textContent=`F${String(n).padStart(2,'0')} / ${current.frame_count} · 已播放 ${Math.floor(elapsed/total)} 周期`;window.reviewState={key:current.key,frame:n,cycles:Math.floor(elapsed/total),playing};}
function tick(t){if(last&&playing)elapsed+=(t-last)*Number($('speed').value);last=t;draw();requestAnimationFrame(tick)}
$('clip').onchange=()=>choose().catch(e=>$('details').textContent=e.message);$('pause').onclick=()=>{playing=!playing;$('pause').textContent=playing?'暂停':'继续';};$('step').onclick=()=>{playing=false;$('pause').textContent='继续';elapsed=(Math.floor(elapsed/current.duration_ms)+1)*current.duration_ms;draw();};$('seam').onclick=()=>{playing=false;$('pause').textContent='继续';const fs=[current.frame_count-2,current.frame_count-1,0,1];elapsed=fs[seamIndex++%4]*current.duration_ms;draw();};$('bg').onclick=()=>{light=!light;draw();};$('guides').onclick=()=>{lines=!lines;$('guides').textContent='辅助线：'+(lines?'开':'关');draw();};
fetch('catalog.json').then(r=>r.json()).then(async data=>{clips=data.clips;for(const c of clips){const option=document.createElement('option');option.value=c.key;option.textContent=labels[c.key];$('clip').append(option)}await choose();requestAnimationFrame(tick)}).catch(e=>$('details').textContent='加载失败：'+e.message);
</script></html>
